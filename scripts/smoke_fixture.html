<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vision Smoke Fixture</title>
<style>
  body { margin: 0; background: #f5f5f5; font-family: sans-serif; }
  .square {
    width: 300px; height: 300px;
    background: #d32f2f;        /* red */
    margin: 80px auto;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .small-blue {
    width: 60px; height: 60px;
    background: #1976d2;        /* blue */
    border-radius: 4px;
  }
  h1 { text-align: center; padding-top: 40px; }
</style>
</head>
<body>
  <h1>Vision Smoke Test</h1>
  <div class="square">
    <div class="small-blue"></div>
  </div>
</body>
</html>
