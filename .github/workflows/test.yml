name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src/ tests/

  mypy-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev deps
        run: pip install -e ".[dev,all]"
      - name: Type-check protocols, backends, and composition-critical modules
        run: >
          python -m mypy
          src/super_browser/browser/engine.py
          src/super_browser/browser/backends/
          src/super_browser/agent/facade.py
          src/super_browser/agent/loop.py
          --ignore-missing-imports

  test:
    needs: [lint, mypy-check]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev deps
        run: pip install -e ".[dev,all]"

      - name: Install Patchright browser
        run: python -m patchright install chromium

      # Hard OCR gate: provision the Tesseract system binary BEFORE pytest so
      # tests/test_composition/test_vision_capture_regression.py's OCR vertical
      # EXECUTES on Ubuntu instead of silently skipping. The version check
      # fails the job if the binary is missing.
      - name: Install Tesseract (OCR release gate)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      # [all] installs the Playwright python package but not its browser;
      # the Playwright engine smoke and verticals need the Chromium binary.
      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Run tests
        run: >
          python -m pytest tests/
          -p no:benchmark
          --cov=super_browser
          --cov-report=xml
          -m "not flaky"
          --ignore=tests/e2e_full_journey.py
          --ignore=tests/e2e_advanced.py
          --ignore=tests/e2e_quickstart.py
          --ignore=tests/e2e_edge_cases.py
          --ignore=tests/e2e/
          --ignore=tests/pattern_validation.py
          --ignore=tests/stealth_detection/
          --ignore=tests/discovery/
          --ignore=tests/adversarial/
          -q
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
